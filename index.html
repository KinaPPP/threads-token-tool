<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threadsトークン 取トーくん - 移転のお知らせ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      background: #f3f5f7;
      color: #1f252d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }
    .box {
      max-width: 620px;
      margin: 0 auto;
      padding: 34px;
      background: #fff;
      border: 1px solid #e0e4e8;
      border-radius: 12px;
      box-shadow: 0 1px 5px #00000008;
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .sub { margin: 0 0 24px; color: #707985; font-size: 12px; }
    p { margin: 14px 0; color: #5f6975; font-size: 14px; }
    .buttons { display: grid; gap: 10px; margin-top: 26px; }
    a.btn {
      display: block;
      padding: 13px 18px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: 700;
    }
    .download { background: #28a745; color: #fff; }
    .github { background: #4a8ce0; color: #fff; }
    .note {
      margin-top: 24px;
      padding: 12px 14px;
      background: #fff9e8;
      border-left: 4px solid #d2a139;
      border-radius: 6px;
      text-align: left;
      font-size: 13px;
      color: #5f6975;
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>🧵 Threadsトークン 取トーくん</h1>
    <div class="sub">Threads Token ShuTo-kun</div>

    <p>旧Web版「Threads API トークン取得ツール」は、Chrome拡張機能版へ移行しました。</p>
    <p>長期トークン取得はChrome拡張内で行い、公開CORSプロキシやKINA管理の中継サーバーは使用しません。</p>

    <div class="buttons">
      <a class="btn download" href="./threads-token-extension-v1.0.0.zip" download>v1.0.0 ZIPをダウンロード</a>
      <a class="btn github" href="https://github.com/KinaPPP/threads-token-tool">GitHub・導入手順を見る</a>
    </div>

    <div class="note">
      Meta for Developersで利用者自身のThreadsアプリを作成し、取トーくんに表示されるリダイレクトURL、App ID、App Secretを使用します。
    </div>
  </main>
</body>
</html>
